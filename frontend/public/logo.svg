<svg width="200" height="240" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="100" y1="20" x2="100" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" /> <!-- Light Gold -->
      <stop offset="50%" stop-color="#F59E0B" /> <!-- Amber -->
      <stop offset="100%" stop-color="#B45309" /> <!-- Dark Amber -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Tech Accents -->
  <circle cx="20" cy="100" r="3" fill="#F59E0B" opacity="0.6"/>
  <line x1="20" y1="100" x2="50" y2="100" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <circle cx="180" cy="140" r="3" fill="#F59E0B" opacity="0.6"/>
  <line x1="180" y1="140" x2="150" y2="140" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>

  <!-- Main Shield Shape -->
  <path d="M100 230C100 230 185 185 185 60L100 15L15 60C15 185 100 230 100 230Z" fill="url(#shieldGrad)" stroke="white" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inner Bevel/Glass Effect -->
  <path d="M100 220C100 220 175 180 175 65L100 25L25 65C25 180 100 220 100 220Z" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Fingerprint Icon (Centered & White/Alpha) -->
  <g transform="translate(50, 70) scale(1.0)" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Outer Arch -->
    <path d="M15 60V50C15 25 35 10 50 10C65 10 85 25 85 50V60"/>
    <!-- Middle Arch -->
    <path d="M30 65V50C30 35 40 25 50 25C60 25 70 35 70 50V70"/>
    <!-- Center Core -->
    <path d="M42 60V50C42 45 45 42 50 42C55 42 58 45 58 50V75"/>
    <path d="M50 60V85"/>
  </g>
  
  <!-- Shine -->
  <path d="M100 15L140 30L100 230L100 15Z" fill="white" fill-opacity="0.1"/>
</svg>
